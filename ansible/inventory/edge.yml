# One K3s cluster per machine. inventory_hostname becomes the Fleet cluster name.
# fleet_labels drive GitRepo/fleet.yaml targeting; keep them boring and stable.
#
# Lab = Vagrant/QEMU VMs on the Mac (socket_vmnet shared subnet 192.168.105.0/24).
# Each VM has two NICs: enp0s1 = QEMU user-mode NAT (10.0.2.15 on every VM, SSH port-forward
# only) and enp0s2 = the static vmnet IP below. K3s is pinned to the enp0s2 address
# (see roles/edge-k3s) so NodePorts are reachable from the Mac.
all:
  children:
    edge:
      vars:
        ansible_user: vagrant
        ansible_become: true
        # per-machine key generated by vagrant; override VAGRANT_DIR if the hub repo lives elsewhere
        ansible_ssh_private_key_file: "{{ lookup('env', 'VAGRANT_DIR') | default('~/Projects/rancher-fleet/vm', true) }}/.vagrant/machines/{{ inventory_hostname }}/qemu/private_key"
        ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
      hosts:
        ubuntu2204:
          ansible_host: 192.168.105.122
          fleet_labels: { env: edge, site: lab, os: ubuntu2204 }
        ubuntu2404:
          ansible_host: 192.168.105.124
          fleet_labels: { env: edge, site: lab, os: ubuntu2404 }
        # 20.04 is below the supported floor; edge-prereqs will refuse it on purpose.
        ubuntu2004:
          ansible_host: 192.168.105.120
          fleet_labels: { env: edge, site: lab, os: ubuntu2004 }
