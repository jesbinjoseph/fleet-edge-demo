---
# Agent-registered clusters get a generated object name (cluster-<hash>); the inventory
# name travels as the `name` label, so select by label.
- name: Wait for each edge cluster to check in on the hub
  ansible.builtin.command: >
    kubectl --context {{ hub_kube_context }} -n {{ hub_fleet_namespace }}
    get clusters.fleet.cattle.io -l name={{ item }} -o jsonpath={.items[*].status.agent.lastSeen}
  loop: "{{ verify_hosts | default(groups['edge']) }}"
  register: seen
  until: seen.stdout | length > 0
  retries: 24
  delay: 10
  changed_when: false

- name: Show cluster status
  ansible.builtin.command: >
    kubectl --context {{ hub_kube_context }} -n {{ hub_fleet_namespace }}
    get clusters.fleet.cattle.io -L name,site --no-headers
  changed_when: false
  register: clusters

- ansible.builtin.debug:
    msg: "{{ clusters.stdout_lines }}"
