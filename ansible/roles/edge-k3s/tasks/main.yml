---
- name: Download k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/share/k3s-install.sh
    mode: "0755"

- name: Install k3s server (single node)
  ansible.builtin.command: /usr/local/share/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server --node-name {{ inventory_hostname }} {{ k3s_server_args | join(' ') }}"
  args:
    creates: /usr/local/bin/k3s

- name: Wait for the node to be Ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 40
  delay: 5
  changed_when: false

- name: Install helm
  ansible.builtin.shell: |
    set -e
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | DESIRED_VERSION={{ helm_version }} bash
  args:
    creates: /usr/local/bin/helm
