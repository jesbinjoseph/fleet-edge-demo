---
# Reads the agent values generated by the ClusterRegistrationToken. Never written to disk
# on the control node; handed to hosts as a 0600 file by edge-fleet-agent.
- name: Read registration secret from the hub
  ansible.builtin.command: >
    kubectl --context {{ hub_kube_context }} -n {{ hub_fleet_namespace }}
    get secret {{ hub_registration_token }} -o jsonpath={.data.values}
  register: hub_token_raw
  changed_when: false
  no_log: true

- name: Fail if the token secret is empty
  ansible.builtin.assert:
    that: hub_token_raw.stdout | length > 0
    fail_msg: "Secret {{ hub_registration_token }} in {{ hub_fleet_namespace }} not found/empty. Apply the ClusterRegistrationToken on the hub first."

- name: Expose values to the edge play
  ansible.builtin.set_fact:
    fleet_agent_values_b64: "{{ hub_token_raw.stdout }}"
  no_log: true
